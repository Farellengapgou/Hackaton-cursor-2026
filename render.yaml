# Blueprint Render — déploiement FinAudit (gratuit)
# Dashboard → New → Blueprint → connecter le repo
# Ou configurer manuellement les 2 services comme dans docs/DEPLOY_RENDER.md

services:
  - type: web
    name: finaudit-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: FINAUDIT_CORS_ORIGIN
        sync: false

  - type: web
    name: finaudit-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
        # Après le 1er déploiement API, mettre : https://finaudit-api.onrender.com
