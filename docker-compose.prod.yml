# Production : une seule URL publique (port 80). L'API n'est pas exposée directement.
# Usage : PUBLIC_URL=https://votre-domaine.com bash scripts/deploy-public.sh

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-20}
      - FINAUDIT_CORS_ORIGIN=${FINAUDIT_CORS_ORIGIN:-http://localhost}
    restart: unless-stopped
    # Pas de ports: — accessible seulement via le réseau Docker (nginx → backend)

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
